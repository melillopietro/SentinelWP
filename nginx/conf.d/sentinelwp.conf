# Upstream definition for Flask/Gunicorn backend
upstream sentinelwp_backend {
    server web:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name _;

    # Allow healthchecks over HTTP locally if needed
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Gateway
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS Certificates (self-signed default or enterprise-provided)
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none';" always;

    # Request limits & timeouts
    client_max_body_size 25M;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # Proxy Headers (precise single hop forwarding)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_buffering on;
    proxy_buffers 8 16k;
    proxy_buffer_size 16k;

    # Rate-limited authentication endpoints
    location = /login {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://sentinelwp_backend;
    }

    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://sentinelwp_backend;
    }

    # API endpoints
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://sentinelwp_backend;
    }

    # Health and readiness proxy pass
    location ~ ^/(health|ready|metrics)$ {
        access_log off;
        proxy_pass http://sentinelwp_backend;
    }

    # Static assets caching
    location /static/ {
        proxy_pass http://sentinelwp_backend;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Default application routing
    location / {
        proxy_pass http://sentinelwp_backend;
    }
}
