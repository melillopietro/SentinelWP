{% extends "base.html" %}
{% block title %}WSA Pro - Login{% endblock %}
{% block content %}
<div style="max-width:400px;margin:80px auto;">
    <div style="text-align:center;margin-bottom:32px;">
        <h1 style="font-size:28px;font-weight:700;">WSA Pro</h1>
        <p style="color:var(--text-muted);margin-top:8px;">WordPress Security Auditor</p>
    </div>
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:32px;">
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autofocus placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
